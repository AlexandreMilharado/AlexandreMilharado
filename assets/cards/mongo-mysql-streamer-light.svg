    .arrow { fill: #1a7f37; font-size: 16px; font-weight: 700; }
    .desc { fill: #59636e; font-size: 14px; }
    .chip { fill: #0969da; font-size: 12px; }
    .chipbg { fill: rgba(9,105,218,0.08); stroke: rgba(9,105,218,0.3); }
    .badge { fill: #9a6700; font-size: 12px; }
    .badgebg { fill: rgba(154,103,0,0.08); stroke: rgba(154,103,0,0.35); }
    .code { font-size: 13px; }
    .kw { fill: #cf222e; } .ty { fill: #953800; } .an { fill: #8250df; } .st { fill: #0a3069; } .dim { fill: #6e7781; } .ok { fill: #1a7f37; }
    .card { animation: show 0.5s ease-out both; }
    @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
