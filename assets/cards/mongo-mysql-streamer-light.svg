<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
  <title id="t">Mongo → MySQL streamer</title>
  <desc id="d">Real-time MongoDB to MySQL replication over MQTT with checkpointing and retry logic.</desc>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace; fill: #1f2328; white-space: pre; }
