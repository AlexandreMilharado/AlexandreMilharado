<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Alexandre Milharado — Machine Learning Engineer</title>
  <desc id="desc">A terminal "training run" where each epoch is a career milestone and the loss curve converges to: Junior ML Engineer at LTPLabs, Lisbon.</desc>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #1f2328; white-space: pre; }
    .dim { fill: #6e7781; }
    .prompt { fill: #1a7f37; }
    .cmd { fill: #1f2328; }
    .flag { fill: #0969da; }
    .loss { fill: #9a6700; }
    .ok { fill: #1a7f37; font-weight: 700; }
    .hl { fill: #1f2328; font-weight: 700; }
    .str { fill: #0a3069; }
    .axis { stroke: #d0d7de; stroke-width: 1; }
    .track { fill: #eaeef2; }
    .bar { fill: #1a7f37; transform-box: fill-box; transform-origin: left; animation: fill 0.9s ease-out both; }
    .curve { fill: none; stroke: #1a7f37; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 400; animation: draw 3.6s ease-in-out 0.8s both; }
    .dot { fill: #1a7f37; animation: show 0.3s ease-out 4.4s both; }
    .line { animation: show 0.35s ease-out both; }
    .cursor { fill: #1f2328; font-weight: 400; animation: show 0.1s 5.6s both, blink 1s step-end 5.6s infinite; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="958" height="298" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h934 a12 12 0 0 1 12 12 v25 h-958 z" fill="#f6f8fa"/>
  <line x1="1" y1="38" x2="959" y2="38" stroke="#d0d7de"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="480" y="25" text-anchor="middle" class="dim" style="font-size:13px">alexandre@lisbon: ~/career</text>

  <!-- log -->
  <g class="line" style="animation-delay:0.1s">
    <text x="28" y="76"><tspan class="prompt">$ </tspan><tspan class="cmd">python train.py </tspan><tspan class="flag">--model</tspan><tspan class="cmd"> alexandre_milharado </tspan><tspan class="flag">--epochs</tspan><tspan class="cmd"> 3</tspan></text>
  </g>

  <g class="line" style="animation-delay:0.8s">
    <text x="28" y="112">Epoch 1/3</text>
    <rect class="track" x="124" y="103" width="110" height="9" rx="2"/>
    <rect class="bar" x="124" y="103" width="110" height="9" rx="2" style="animation-delay:0.9s"/>
    <text x="250" y="112"><tspan class="dim">loss </tspan><tspan class="loss">0.842</tspan></text>
    <text x="370" y="112" class="dim">BSc Computer Engineering · ISCTE · top 5%</text>
  </g>

  <g class="line" style="animation-delay:2s">
    <text x="28" y="142">Epoch 2/3</text>
    <rect class="track" x="124" y="133" width="110" height="9" rx="2"/>
    <rect class="bar" x="124" y="133" width="110" height="9" rx="2" style="animation-delay:2.1s"/>
    <text x="250" y="142"><tspan class="dim">loss </tspan><tspan class="loss">0.311</tspan></text>
    <text x="370" y="142" class="dim">SWE Intern · Bubble-go (Sword Group)</text>
  </g>

  <g class="line" style="animation-delay:3.2s">
    <text x="28" y="172">Epoch 3/3</text>
    <rect class="track" x="124" y="163" width="110" height="9" rx="2"/>
    <rect class="bar" x="124" y="163" width="110" height="9" rx="2" style="animation-delay:3.3s"/>
    <text x="250" y="172"><tspan class="dim">loss </tspan><tspan class="loss">0.047</tspan></text>
    <text x="370" y="172" class="dim">MSc Computer Engineering · Teaching Assistant</text>
  </g>

  <g class="line" style="animation-delay:4.4s">
    <text x="28" y="216"><tspan class="ok">✓ converged</tspan><tspan class="dim">  →  </tspan><tspan class="hl">Junior ML Engineer</tspan><tspan class="dim"> @ </tspan><tspan class="hl">LTPLabs</tspan><tspan class="dim"> · Lisbon, PT</tspan></text>
  </g>

  <g class="line" style="animation-delay:5s">
    <text x="28" y="256"><tspan class="dim">&gt;&gt;&gt; </tspan><tspan class="cmd">alexandre.predict(</tspan><tspan class="str">"your next project"</tspan><tspan class="cmd">) </tspan><tspan class="cursor">█</tspan></text>
  </g>

  <!-- loss curve -->
  <g transform="translate(770 62)">
    <text x="0" y="0" class="dim" style="font-size:12px">training loss</text>
    <line class="axis" x1="0" y1="14" x2="0" y2="150"/>
    <line class="axis" x1="0" y1="150" x2="160" y2="150"/>
    <path class="curve" d="M4 22 C 30 70, 46 112, 80 128 S 130 142, 156 144"/>
    <circle class="dot" cx="156" cy="144" r="4"/>
    <text x="0" y="168" class="dim" style="font-size:12px">2021</text>
    <text x="160" y="168" class="dim" style="font-size:12px" text-anchor="end">2026</text>
  </g>
</svg>
